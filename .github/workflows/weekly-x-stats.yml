name: weekly-x-stats

on:
  schedule:
    - cron: "0 15 * * 2" # martes 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose but don't post)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: scripts/x-publish
        run: npm ci
      - name: Post weekly stats
        working-directory: scripts/x-publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node weekly-stats.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
